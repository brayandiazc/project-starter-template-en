# template-update-check.yml — notifies when the origin template ships improvements.
#
# Runs weekly in INSTANTIATED projects (requires `.template-origin`, written by
# /instantiate; does nothing without it). Compares the template commit recorded at
# instantiation with the template repo's current HEAD, limited to tooling paths,
# and opens (or updates) an issue with the summary. To apply the improvements:
# /update-template skill.
name: Template improvements notice

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare against the origin template
        id: diff
        run: |
          set -euo pipefail
          if [ ! -f .template-origin ]; then
            echo "No .template-origin: this repo is not an instance. Nothing to do."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          repo="$(sed -n 's/^repo=//p' .template-origin | head -1)"
          base="$(sed -n 's/^commit=//p' .template-origin | head -1)"
          if [ -z "$repo" ] || [ -z "$base" ]; then
            echo "::warning::.template-origin incomplete (repo/commit); skipping."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --quiet --filter=blob:none "$repo" /tmp/tpl
          cd /tmp/tpl
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $base not found in the template; skipping."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-status "$base"..HEAD -- \
            .claude/ .github/scripts/ .github/workflows/ specs/_template/ \
            docs/conventions/_template.md || true)"
          if [ -z "$files" ]; then
            echo "No tooling changes in the template since $base."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(git rev-parse --short HEAD)"
          {
            echo "changed=1"
            echo "head=$head"
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Open or update the notice issue
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.diff.outputs.files }}
          HEAD: ${{ steps.diff.outputs.head }}
        run: |
          set -euo pipefail
          title="The origin template has pending tooling improvements"
          body="$(printf 'The origin template changed its tooling since the last sync (current HEAD: `%s`).\n\nAffected files:\n\n```\n%s\n```\n\nTo review and apply the improvements, run the `/update-template` skill in Claude Code.\n\n_Issue generated by `.github/workflows/template-update-check.yml`._' "$HEAD" "$FILES")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "template-update" \
              || gh issue create --title "$title" --body "$body"
          fi
