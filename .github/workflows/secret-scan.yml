# ==============================================================================
# Secret scanning — ACTIVE and stack-agnostic.
# Runs gitleaks over the history to detect leaked credentials.
# Complements the policy in SECURITY.md and docs/conventions/secrets.md.
# Note: on organization repos, gitleaks-action requires the GITLEAKS_LICENSE
# variable (free for personal accounts).
# ==============================================================================

name: Secret scan

# On `push`, only `main`: without branch protection nothing technically stops a direct
# push to production, so history scanning there is a real backstop. On `develop` the PR
# already scanned it, and that run was a duplicate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# gitleaks-action reads the PR commits through the API; without these
# permissions the GITHUB_TOKEN returns 403 (Resource not accessible by
# integration).
# A new push to the PR cancels the previous scan. On `main` nothing is cancelled: there
# the history scan is the one that counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
