# release.yml — automatically publishes the GitHub release when main is updated.
#
# Flow (CONTRIBUTING.md + /release skill): before merging develop → main, cut the
# version in CHANGELOG.md (move Unreleased to "## [X.Y.Z] - date"). On merge to
# main, this workflow detects that version and, if it has no tag yet, creates the
# vX.Y.Z tag and the GitHub release with that section's notes. No merge to
# production is left without a release.
name: Automatic release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time: two pushes to main in a row before the first finishes would
# both see "version with no tag" and the second `gh release create` would fail.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect unpublished version in CHANGELOG
        id: v
        run: |
          set -euo pipefail
          # Only versions with a real date (ignores placeholders like "[DATE]").
          line="$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md || true)"
          if [ -z "$line" ]; then
            echo "No dated version in CHANGELOG; nothing to publish."
            echo "publish=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/' <<<"$line")"
          # Never publish a version OF THE TEMPLATE. That happens when `main` is
          # published before resetting the CHANGELOG: main points at the initial
          # commit and this workflow, fired by that push, runs against that branch's
          # content —not against what you have in front of you— and creates the tag
          # and the release with the origin repository's notes. The criterion lives
          # in check-inheritance.sh, which already knows what inheritance is.
          if ! bash .github/scripts/check-inheritance.sh --publishable-version; then
            echo "publish=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already tagged; nothing to publish."
            echo "publish=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Notes: this version's section (up to the next "## [").
          awk -v ver="[$version]" '
            index($0, "## " ver) == 1 { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >/tmp/notes.md
          {
            echo "publish=1"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.v.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
          echo "Published v$VERSION."
