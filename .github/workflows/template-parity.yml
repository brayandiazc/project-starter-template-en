# ==============================================================================
# Parity between variants — TEMPLATE-REPO ONLY.
# Compares the file structure with the Spanish sibling variant so that no
# change is left unported. The `if` condition keeps it from running in
# instantiated projects; delete it anyway when you instantiate the template.
#
# On a PR it is informational (continue-on-error): divergence is normal until
# the equivalent change lands in the sibling variant.
# ==============================================================================

name: Parity between variants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: Parity with the sibling variant
    if: github.repository == 'brayandiazc/project-starter-template-en'
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the sibling variant (es)
        uses: actions/checkout@v7
        with:
          repository: brayandiazc/project-starter-template-es
          path: .sibling
      - name: Compare structure
        run: bash .github/scripts/check-parity.sh .sibling
