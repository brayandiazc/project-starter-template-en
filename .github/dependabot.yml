# ==============================================================================
# Dependabot configuration
# ==============================================================================
# Dependabot checks your dependencies and opens PRs to update them.
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# ADJUST the `package-ecosystem` entries to the ones your project uses. Below are
# github-actions (almost always useful) and one commented example per ecosystem.
# ==============================================================================

version: 2

updates:
  # GitHub Actions used in the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    # Git Flow: dependency PRs target develop, never main directly.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # One PR with every action instead of one per action: there is no lockfile
    # here, so grouping is just less noise. Where it really matters is below.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci-cd"
      # Dependabot does not write the CHANGELOG, and cannot learn to: without
      # this, the `changelog` job in quality.yml takes down ALL of its PRs with
      # everything else green. The exception was already designed; now its PRs
      # are born with it.
      - "sin-changelog"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ── Examples per ecosystem — uncomment the one that applies ────────────────
  #
  # (remember to include target-branch: "develop" in every ecosystem you enable)
  #
  # - package-ecosystem: "npm"        # Node.js
  #   directory: "/"
  #   target-branch: "develop"
  #   schedule:
  #     interval: "weekly"
  #   # ONE PR with every bump, not one per package. Merging N separate bumps in
  #   # a chain leaves a lockfile nobody ever built: git does not flag a
  #   # conflict —each bump touches a different spot in the file— and CI does
  #   # not see it either, because each PR is built on its own branch, never on
  #   # the result of merging them all. Grouped, that state DOES go through the
  #   # build. The price: if one bump in the group breaks, the whole group is
  #   # blocked and you have to find out which one.
  #   groups:
  #     dependencies:
  #       patterns: ["*"]
  #   labels: ["dependencies", "sin-changelog"]
  #
  # - package-ecosystem: "pip"        # Python
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #
  # - package-ecosystem: "bundler"    # Ruby
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #
  # - package-ecosystem: "gomod"      # Go
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #
  # - package-ecosystem: "docker"     # Dockerfile
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
